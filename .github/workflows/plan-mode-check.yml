name: Plan-mode extension typecheck

   on:
     pull_request:
       paths:
         - "pi/extensions/plan-mode/**"
         - ".github/workflows/plan-mode-check.yml"

   permissions:
     contents: read

   jobs:
     tsc:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
             node-version: 24
             cache: npm
             cache-dependency-path: pi/extensions/plan-mode/package-lock.json
         - name: Install dependencies
           working-directory: pi/extensions/plan-mode
           run: npm ci
         - name: Typecheck (catches undeclared identifiers, e.g. airegapMode regression)
           working-directory: pi/extensions/plan-mode
           run: npm run check
